# Fukumi for iPad. Generate the Xcode project with:  xcodegen generate   (in this folder)
name: Fukumi
options:
  bundleIdPrefix: com.example
  developmentLanguage: it
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  Fukumi:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Fukumi
      # The instrument's page, built by build_web.py: copied into the app as the folder "app".
      - path: ../web/app
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Fukumi
        # Change it to your own identifier (also in Xcode, Signing & Capabilities).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fukumi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Fukumi/Info.plist
      properties:
        CFBundleDisplayName: Fukumi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Fukumi registra e trasforma il suono degli ingressi: il microfono dell'iPad o l'interfaccia audio collegata."
        # The page is served by the app itself, on this iPad only (http://localhost).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: Paper
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme: {}
