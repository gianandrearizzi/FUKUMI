name: Disimballa
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q fukumi_progetto.zip -d /tmp/p
          mv /tmp/p/fukumi/.github /tmp/p/fukumi/github-temp
          cp -a /tmp/p/fukumi/. .
          git rm -q fukumi_progetto.zip
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "Disimballa il progetto"
          git push
