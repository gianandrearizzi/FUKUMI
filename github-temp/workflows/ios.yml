# Fukumi for iPad: checks that the app builds at every change, and on request
# signs it and sends it to TestFlight (Actions > "App iPad" > Run workflow).
name: App iPad

on:
  push:
    branches: [main]
    paths: ['ios/**', 'web/app/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'web/app/**']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Firma e carica su TestFlight'
        type: boolean
        default: true

jobs:
  build:
    name: Build per il simulatore
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Progetto Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ios/Fukumi.xcodeproj -scheme Fukumi -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -quiet build CODE_SIGNING_ALLOWED=NO

  testflight:
    name: TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Progetto Xcode
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Chiave App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
      - name: Archivio firmato
        run: |
          xcodebuild -project ios/Fukumi.xcodeproj -scheme Fukumi -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Fukumi.xcarchive" -quiet archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Caricamento su TestFlight
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fukumi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Pulizia
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
